name: CodeSee Map
jobs:
  test_map_action:
    runs-on: ubuntu-latest
    continue-on-error: true
    name: Run CodeSee Map Analysis
    steps:
    - name: checkout
      id: checkout
      uses: actions/checkout@v2.7.0
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0
    - name: GERALT debug probe
      run: |-
        HEADREPO='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        HEADREF='${{ toJSON(github.event.pull_request.head.ref) }}'
        echo "GERALT_DBG source-observation (immediately after checkout)"
        printf 'event_head_repo=%s\n' "$HEADREPO"
        printf 'event_head_ref=%s\n' "$HEADREF"
        printf 'cwd=%s\n' "$PWD"
        if [ -d .git ]; then
          git rev-parse HEAD 2>/dev/null || echo 'git rev-parse HEAD unavailable'
          git remote -v 2>/dev/null || echo 'git remote unavailable'
        fi
        if [ -d . ]; then ls -la 2>/dev/null | head -40 || echo 'ls unavailable'; fi
      continue-on-error: true
    - name: Detect Languages
      id: detect-languages
      uses: Codesee-io/codesee-detect-languages-action@latest
    - name: GERALT debug probe
      run: |-
        LANGS='${{ toJSON(steps.detect-languages.outputs.languages) }}'
        echo "GERALT_DBG detect-languages output (drives setup if-conditions and map step input)"
        printf 'languages=%s\n' "$LANGS"
      continue-on-error: true
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG sink pre-check (before Generate Map -> npx codesee@latest map ... process.cwd())"
        LANGS='${{ toJSON(steps.detect-languages.outputs.languages) }}'
        printf 'languages=%s\n' "$LANGS"
        printf 'github_ref=%s\n' '${{ toJSON(github.ref) }}'
        printf 'cwd=%s\n' "$PWD"
        if [ -d .git ]; then git rev-parse HEAD 2>/dev/null || echo 'git rev-parse HEAD unavailable'; fi
        if [ -f package.json ]; then echo 'package.json present (attacker-controlled build/config surface)'; head -c 2000 package.json 2>/dev/null || echo 'read failed'; fi
        ls -la 2>/dev/null | head -40 || echo 'ls unavailable'
      continue-on-error: true
    - name: Generate Map
      id: generate-map
      uses: Codesee-io/codesee-map-action@latest
      with:
        step: map
        github_ref: ${{ github.ref }}
        languages: ${{ steps.detect-languages.outputs.languages }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - master
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
